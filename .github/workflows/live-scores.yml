name: Live scores

# Vercel Hobby crons run at most once a day, so this polls the live-score
# route every few minutes instead. Needs the APP_URL and CRON_SECRET repository
# secrets; without them the job skips.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll /api/cron/live
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/live"
